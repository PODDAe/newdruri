<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEEN SEYA XMD | Advanced Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.4.0/axios.min.js"></script>
    
    <style>
        :root {
            --anime-cyan: #00f2ff;
            --anime-pink: #ff007a;
            --anime-purple: #bc13fe;
            --glass: rgba(5, 5, 5, 0.85);
            --border: rgba(0, 242, 255, 0.2);
            --glow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            cursor: crosshair; /* Advanced aesthetic cursor */
        }

        body {
            background-color: #020202;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
        }

        /* --- Dynamic Matrix Background --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        .anime-bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.alphacoders.com/134/1345436.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            filter: brightness(0.3) contrast(1.2);
        }

        /* --- Advanced Sidebar --- */
        .menu-trigger {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1001;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, var(--anime-pink), var(--anime-purple));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glow);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .menu-trigger:hover { transform: scale(1.1) rotate(90deg); }

        .side-nav {
            position: fixed;
            right: -350px;
            top: 0;
            width: 320px;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(40px);
            z-index: 1000;
            padding: 100px 30px;
            transition: 0.6s cubic-bezier(0.85, 0, 0.15, 1);
            border-left: 2px solid var(--anime-cyan);
        }

        .side-nav.active { right: 0; }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            color: #fff;
            text-decoration: none;
            margin-bottom: 15px;
            border-radius: 15px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            transition: 0.4s;
        }

        .nav-item i { margin-right: 15px; font-size: 20px; color: var(--anime-cyan); }
        .nav-item:hover {
            background: var(--anime-cyan);
            box-shadow: 0 0 30px var(--anime-cyan);
            transform: translateX(-15px);
            color: #000;
        }

        /* --- Main UI Card --- */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 242, 255, 0.1);
            animation: cardEntrance 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.8) translateY(50px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* --- Animated Logo --- */
        .orbit-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 35px;
        }

        .orbit {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .orbit-1 { border-top-color: var(--anime-cyan); animation: spin 4s linear infinite; filter: drop-shadow(0 0 5px var(--anime-cyan)); }
        .orbit-2 { border-right-color: var(--anime-pink); animation: spin 3s linear infinite reverse; width: 80%; height: 80%; top: 10%; left: 10%; }
        
        .logo-img {
            position: absolute;
            top: 20%; left: 20%; width: 60%; height: 60%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 5;
            border: 2px solid var(--anime-cyan);
            box-shadow: 0 0 30px var(--anime-cyan);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 26px;
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--anime-cyan), #fff, var(--anime-pink), var(--anime-cyan));
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s linear infinite;
        }

        @keyframes gradientMove { to { background-position: 300%; } }

        /* --- Advanced Controls --- */
        input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 20px;
            color: var(--anime-cyan);
            font-size: 20px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.4s;
            margin: 30px 0;
        }

        input:focus {
            outline: none;
            border-color: var(--anime-cyan);
            background: rgba(0, 242, 255, 0.05);
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.4);
        }

        .neon-btn {
            width: 100%;
            padding: 22px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(45deg, var(--anime-pink), var(--anime-purple));
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 40px rgba(255, 0, 122, 0.4);
        }

        .neon-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px var(--anime-pink);
            letter-spacing: 5px;
        }

        .pair-code-box {
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--anime-cyan);
            padding: 30px;
            border-radius: 20px;
            font-size: 36px;
            color: var(--anime-cyan);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--anime-cyan);
            margin-top: 30px;
            cursor: copy;
            transition: 0.3s;
        }

        .pair-code-box:active { transform: scale(0.95); }

        .loader {
            display: none;
            width: 35px;
            height: 35px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--anime-cyan);
            border-radius: 50%;
            animation: spin 0.6s infinite linear;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="anime-bg-img"></div>
    <canvas id="bg-canvas"></canvas>

    <div class="menu-trigger" onclick="toggleMenu()">
        <i class="fas fa-th-large" id="m-icon"></i>
    </div>

    <nav class="side-nav" id="sideNav">
        <h2 style="font-family: Syncopate; color: var(--anime-pink); margin-bottom: 50px; font-size: 18px; letter-spacing: 3px;">QUEEN SEYA XMD</h2>
        
        <a href="tel:+243861513542" class="nav-item">
            <i class="fas fa-id-badge"></i> Developer
        </a>
        
        <a href="https://chat.whatsapp.com/YOUR_LINK" class="nav-item">
            <i class="fab fa-whatsapp"></i> Support Hub
        </a>
        
        <a href="https://whatsapp.com/channel/YOUR_LINK" class="nav-item">
            <i class="fas fa-broadcast-tower"></i> Updates
        </a>
    </nav>

    <div class="main-card">
        <div class="orbit-container">
            <div class="orbit orbit-1"></div>
            <div class="orbit orbit-2"></div>
            <img src="https://i.ibb.co/Zp7mFJfV/tourl-1766737770669.jpg" class="logo-img" alt="Queen Seya Logo">
        </div>

        <h1>QUEEN SEYA XMD</h1>
        <p style="color: #888; font-size: 11px; letter-spacing: 3px;">ADVANCED NEURAL PAIRING V3.0</p>

        <input type="tel" id="phoneNumber" placeholder="+94 7X XXX XXXX" autocomplete="off">

        <button class="neon-btn" onclick="getPairCode()" id="submitBtn">
            <span id="btnText">INITIATE CONNECTION</span>
            <div class="loader" id="loader"></div>
        </button>

        <div id="code-display-area" style="display: none; animation: cardEntrance 0.8s forwards;">
            <p style="font-size: 11px; color: var(--anime-cyan); margin: 25px 0 10px; font-weight: 600;">ENCRYPTED KEY GENERATED</p>
            <div class="pair-code-box" onclick="copyCode()" id="finalCode">--------</div>
        </div>

        <p id="status-msg" style="margin-top: 30px; font-weight: 600; font-size: 14px; min-height: 20px; transition: 0.3s;"></p>
    </div>

    <script>
        // --- Enhanced Matrix Rain ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = "QUEENSEYAXMD0101たなかあきら";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2ff";
            ctx.font = fontSize + "px 'JetBrains Mono'";

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 60);

        // --- Core Logic ---
        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const icon = document.getElementById('m-icon');
            nav.classList.toggle('active');
            icon.className = nav.classList.contains('active') ? 'fas fa-times' : 'fas fa-th-large';
        }

        async function getPairCode() {
            const num = document.getElementById('phoneNumber').value.replace(/[^0-9]/g, '');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status-msg');
            const display = document.getElementById('code-display-area');

            if (num.length < 10) {
                status.style.color = 'var(--anime-pink)';
                status.innerText = "🚨 INVALID SEQUENCE: CHECK NUMBER";
                return;
            }

            btnText.style.display = 'none';
            loader.style.display = 'block';
            status.innerText = "AUTHENTICATING...";
            status.style.color = "#fff";

            try {
                const { data } = await axios.get(`/code?number=${num}`);
                if(data.code) {
                    document.getElementById('finalCode').innerText = data.code;
                    display.style.display = 'block';
                    status.style.color = 'var(--anime-cyan)';
                    status.innerText = "✨ LINK ESTABLISHED";
                }
            } catch (e) {
                status.style.color = 'var(--anime-pink)';
                status.innerText = "🚫 NODE OFFLINE: TRY LATER";
            } finally {
                btnText.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        function copyCode() {
            const code = document.getElementById('finalCode').innerText;
            navigator.clipboard.writeText(code);
            const status = document.getElementById('status-msg');
            const originalText = status.innerText;
            status.innerText = "📋 KEY COPIED TO BUFFER";
            setTimeout(() => status.innerText = originalText, 2500);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
        </html>
